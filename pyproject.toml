[project]
name = "earth-similarity-explorer"
version = "0.1.0"
description = "Similarity search application based on AlphaEarth Embeddings"
readme = "README.md"
authors = [
    { name = "Emil Dietrich", email = "emil.c.dietrich@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "types-pyyaml>=6.0.12.20261122",
]
