[project]
name = "earth-similarity-explorer"
version = "0.1.0"
description = "Similarity search application based on AlphaEarth Embeddings"
readme = "README.md"
authors = [
    { name = "Emil Dietrich", email = "emil.c.dietrich@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "earthengine-api>=1.7.53",
    "fastapi>=0.165.0",
    "google-auth>=2.63.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "ipyleaflet>=0.20.0",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "types-pyyaml>=6.0.12.20261122",
    "types-shapely>=2.2.0.20261122",
]
