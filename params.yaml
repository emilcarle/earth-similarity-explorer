# Tuned pipeline parameters. DVC tracks each key, so a change reruns only the stages
# that use it. Loaded and validated by earth_similarity_explorer/params.py.

# Areas that `dvc repro` builds. Each needs a config in areas/<id>.yaml
areas:
  - schlehdorf
  - upper-bavaria

# The export of the embeddings from Earth Engine in square tiles on a grid anchored
# at (0, 0). Whole grid cells of every size to try must fit into a tile
export:
  tile_size_m: 20000

# The grid baseline of square cells with mean embeddings
grid:
  cell_size_m: 100
