name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Pipeline and API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install Python and dependencies
        id: sync
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Linting
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check

      - name: Type checking
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ty check

      - name: Testing
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest

  web:
    name: Webpage (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Formatting and linting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx biome ci

      - name: Type checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Building
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
