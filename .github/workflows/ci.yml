name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Linting, type checking and testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install Python and dependencies
        id: sync
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Linting
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check

      - name: Type checking
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ty check

      - name: Testing
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest
