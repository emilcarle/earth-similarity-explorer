# Git hooks run before every commit; install once per clone: uv run pre-commit install
# Local hooks with `uv run` use the ruff version locked in uv.lock, like CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
